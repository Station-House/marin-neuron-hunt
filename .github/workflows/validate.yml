name: validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python scripts/validate.py
      - run: python -m unittest scripts/test_check_claims.py
      - run: python -m unittest scripts/test_check_design.py
      - run: python -m unittest scripts/test_design_session_note.py

  # Each [[ ]] target must be one Marin token, as the daily runner requires. The log lists every target token.
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml "transformers==5.10.2"
      - run: python scripts/check_tokens.py

  # The runner's hooks (on a tiny random model) and pass rules.
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==5.10.2" pyyaml jsonschema pyarrow numpy
      - run: python -m unittest runner/test_runner.py

  # Fails a PR that changes the explanation of a neuron someone else holds on Station House.
  claims:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Diff against the base tip this merge ref was built on. pull_request.base.sha can be
      # older, and then everything merged to main since then counts as this PR's change.
      - run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - run: python scripts/check_claims.py
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}

  # Fails a PR that adds or changes an experiment request without a filled-in design
  # (the PR description's ## Design section, or requests/<id>/DESIGN.md for a custom request).
  design:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Diff against the base tip this merge ref was built on. pull_request.base.sha can be
      # older, and then everything merged to main since then counts as this PR's change.
      - run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - run: python scripts/check_design.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      # A note, not a gate: requests without a Station House Experimentation Wizard review get a warning.
      - run: python scripts/design_session_note.py
        if: always()
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
