# Evidence = exemplar ranks in pilot/fineweb-10m-sparse/summaries/exemplars.parquet.
# "Strong" = at least 30% of each side's peak (+ >= 0.206, - <= -0.218), over all 4,667 stored firings.
# Rates and ratios compare inside-word pieces (only letters A-Z, previous token ending in a letter) across
# all 10,000,384 tokens of the sample; full tests, with rules written before running them, are in the
# notebook linked from the PR (12 of 16 passed).
neuron: L1-N16217
data: pilot/fineweb-10m-sparse
label: "inside-word pieces: -ed spellings vs capital-E words"
positive:
  status: explained
  confidence: weak
  cue_type: subword
  explanation: >-
    Fires on a later piece inside a rare word and never on a piece ending in "-ed" (0 of 29,642); pieces
    inside words starting with a capital E (E|ct|odermal, E|CT, E|RE, E|rem|ite, Euch|re) fire 42.3x as often
    as other inside-word pieces (95% CI 27.3-65.5x) and make up 46% of its 81 strong firings, while most of the
    rest are endings of rare names (Keshish|ian, Aksum|ite, Klev|ius), which other layer-1 neurons also fire on.
    The E-word evidence is thin: 37 strong firings from 17 documents, and only 5 of the top 32 on fineweb-1m.
  fires_on: "the piece after a word-initial capital E (Ect-, ECT, ERE, Erem-, Euch-) and endings of rare names such as -ite, -ian, -ius"
  not_on: >-
    a word's first piece (0 of 81 strong firings); pieces ending in "-ed" (0 strong firings on 29,642);
    words starting with a lowercase e fire about a tenth as often as capital-E words; sparse tier only,
    not checked in the deep tier
  evidence: [1, 7, 9, 14, 22, 23, 26, 29]
  verification: untested
negative:
  status: explained
  confidence: weak
  cue_type: subword
  explanation: >-
    Fires on a later piece inside a word, mostly on particular "-ed"-spelled pieces in names and non-English
    words (Aze|ved|o, zuf|ried|en, Al-S|ayed, Hal|sted, fr|ayed) and on pieces of "pleat"; inside-word "-ed"
    pieces fire 17.8x as often as other inside-word pieces (95% CI 14.3-22.1x) and are 45% of its 325 strong
    firings. It is not a suffix detector: the common endings ed, ized and ised almost never fire, and the same
    piece fires in some words but never in others (ple|ated 8 of 8, elong|ated 0 of 37).
  fires_on: "particular -ed / -ED pieces inside names and non-English words (Azevedo, Al-Sayed, zufrieden, Halsted, frayed, breasted), and pieces of pleat, pleats, pleating, pleated"
  not_on: >-
    a word's first piece (1 of 325 strong firings, " Fried" at a document's start); the common suffix
    pieces ed, ized, ised, ified (1 strong firing in about 8,600); other ple- words such as pleasure or
    pleads; sparse tier only, not checked in the deep tier
  evidence: [0, 1, 3, 4, 6, 9, 19, 23, 25, 28, 30]
  verification: untested
relation: variant
relation_note: >-
  Both sides fire almost only on pieces inside words, almost never on a word's first piece (1 of the 406
  strong firings, " Fried" in "Pan Fried Buns" at -0.296; on fineweb-1m, 31 and 30 of the top 32 are
  inside-word pieces), and split by spelling: "-ed"-type pieces go negative, capital-E
  words and rare-name endings go positive. The - side is the main one (325 strong firings vs 81). Of 16
  checks with rules set in advance, 12 passed: both patterns hold in both halves of the documents, without
  the 5 busiest documents, and against 30 random layer-1 neurons. Two cautions: the "-ed" share does not
  peak in the strongest firings, and the "-ed" pattern only partly replicates on fineweb-1m (8 of the top
  32 - firings, 25%), a sample that shares some documents with the 10M one. The logit lens shows no
  coherent next-token pattern on either side, as expected for layer 1; weak - firings on " build" (196)
  and " homes" (188) look like repeated boilerplate and are not used as evidence.
by:
  - {github: mewni, method: agent, model: claude-opus-5-5}
