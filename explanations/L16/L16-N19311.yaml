neuron: L16-N19311
data: pilot/fineweb-10m-sparse
label: "added increment vs return to earlier episode"
positive:
  status: explained
  confidence: weak
  cue_type: grammar
  explanation: >-
    Fires on a word that adds a small, counted increment to an amount already in play, as in "a few more
    days", "two more weeks", "another year" and "an additional benefit". The concept fires, not the word:
    in the same sentence, "extra", "additional" and "another" keep it. The count matters: removing "a few"
    closes the gate, and a vague "many more" is weak.
  fires_on: "'more' / 'another' / 'additional' / 'extra' / 'further' after a small count, e.g. 'for a few more days', 'two more weeks'"
  not_on: >-
    degree 'more' ('the choice only got more difficult'), bare 'more' ('I want more chocolate') and
    'even more' (negative). Measured on edited prompts, not in the deep tier.
  evidence: [1, 2, 5, 6, 8, 9, 11, 12, 14, 25]
  verification: untested
negative:
  status: explained
  confidence: weak
  cue_type: discourse-structure
  explanation: >-
    Fires when the text marks the current event as a repeat of, or a return to, an earlier episode, as in
    "Part II ... Today we continue", "this time", "pick up with chapter 10" and "returned to continue". When
    the earlier episode is removed ("The first entry ... this time", "1stRound ... same as"), the activation
    goes to about zero. The gate stays open; `up` carries the sign.
  fires_on: "'continue', 'this time', 'same', 'yet', 'again', 'pick up' when they point back to an earlier, separate episode"
  not_on: >-
    the same words with no earlier episode ('The first entry ... this time', '1stRound: Opening verse, same as').
    Measured on edited prompts, not in the deep tier. The stored negative rows are 3 times as many as the
    positive rows and include many common tokens (',', ' the', ' to'), so this side is broader than stated.
  evidence: [0, 1, 6, 10, 11, 14, 22, 24, 25, 26]
  verification: untested
relation: variant
relation_note: >-
  Both sides place an item relative to earlier ones: the positive side adds a new increment, the negative
  side returns to an earlier episode.
by:
