neuron: L36-N23040
data: pilot/fineweb-10m-sparse
label: "case-law text: higher-court references vs case citations"
positive:
  status: explained
  confidence: high
  cue_type: semantic-topic
  explanation: >-
    Fires in text about appellate and supreme-court adjudication: the Supreme Court, appellate courts,
    "case law" and precedent (stare decisis, "cert. denied", a writ of certiorari), constitutional and
    federal law, and "U.S." (U.S. Reports) citations. It fires throughout court / case-law text, landing on court terms
    themselves (" Court", " Supreme", " case", " v.", " U.S.") as much as on the surrounding words; its
    strongest firings are often anticipatory, on the token just before a reference: " the" in "oral
    arguments before the Supreme Court" (+44.0), " by" in "as determined by the Supreme Court" (+42.5),
    " denied" in "a petition for writ of certiorari was denied" (+40.0). The logit lens pushes " Supreme", " judicial", " courts", " appellate" and " court", so part
    of its job is expecting a court reference. The pattern holds down the whole stored distribution
    (15,812 positive firings): the strongest is " ing" in "an amendment to the Constitution overturning"
    (+101.5), and even weak stored firings land on precedent and citations ("long-standing precedents"
    +8.7, "supra at p.387" +6.5). Five random selective L36 neurons showed no legal pattern, so this is
    specific to this neuron, not the layer.
  fires_on: "'Supreme Court', appellate courts, precedent / 'case law', certiorari / 'cert. denied', constitutional & federal law, and 'U.S.' reporter citations - firing throughout such text, on court terms and the surrounding words"
  not_on: >-
    non-legal "court" (tennis / basketball court, royal court, courtship) and ordinary prose. Untested:
    non-firing can't be read from the sparse tier, so this needs the deep tier or an activation-test request.
  evidence: [0, 2, 4, 5, 9, 12, 18, 21, 26, 28]
  verification: requested
negative:
  status: explained
  confidence: weak
  cue_type: format-markup
  explanation: >-
    Much weaker than the + side (min -22.0 vs max +101.5) and far rarer (748 stored negative firings vs
    15,812 positive). Fires on the formal citation and caption apparatus of individual cases, skewed to the
    trial and intermediate level: party captions ("United States v. Price," before "No. CR" -12.8;
    "Plaintiff," before "VILLAGE" -12.2), "F." / "F. Supp." / "N.E." reporter citations ("Virginia v.
    Sebelius," before "728 F." -22.0; "332 F. Supp." before "2d" -13.7), district and circuit judges by name
    ("LIPTON HOLLANDER, District Judge." -17.3; "Circuit Judges, and RONEY" -11.4), and procedural posture
    ("the lower court held" -14.1, "we affirm the judgment of the lower court" -14.1). The gate is open and a
    negative `up` carries the sign. Its logit lens is incoherent, so this side is an input detector, not an
    output-pusher.
  fires_on: "case captions ('X v. Y'), 'F.' / 'F. Supp.' / 'N.E.' reporter citations, district / circuit judges, and procedural posture - the citation / caption machinery of (mostly lower-court) cases"
  not_on: >-
    legal prose with no citation or caption, and academic citations outside law. Untested (same sparse-tier
    caveat). A "404 U.S." cite appears among the negative firings, so the court-level split is a tendency, not
    a rule.
  evidence: [0, 1, 2, 7, 8, 12, 16, 25, 27, 31]
  verification: untested
relation: variant
relation_note: >-
  Both sides fire inside case-law text; the + side marks references to the courts (especially the Supreme
  Court) and precedent, while the - side marks the formal citation and caption apparatus of individual cases,
  concentrated at the trial and intermediate-appellate level.
