neuron: L39-N11669
data: pilot/fineweb-1m
label: "'class' token (+) vs class-like nouns (-)"
positive:
  status: explained
  confidence: high
  cue_type: lexical
  explanation: >-
    Fires very strongly on the token "class" in every sense: school class, social class (all 134
    "middle/working/ruling/upper/social class" tokens on fineweb-10m-sparse fire, median about +25), the
    taxonomic sense ("a class of jobs"), grade labels ("Class II", "Class C fly ash") and code ("Java class"),
    and as the first piece of longer words (classify, classical, classmate, neo-classical, German
    K-lass-ifizierungen). On fineweb-10m-sparse, every one of the 1,165 " class" tokens in the 10M tokens
    crosses the + threshold (q99 0.60; the weakest is +3.1), 93% exceed +19.6 and the max is +136; all 32
    fineweb-1m top exemplars are class/lass tokens (+63 to +104). The logit lens agrees: this
    side pushes the suffixes that complete the word ("ifying", "ifications", "ically", "mate", "ified"). Weaker
    spillover onto the token after "class" (Class|rooms +26, "Class will" +13). In one syllabus about educational
    inequality, equality/inequality/egalitarian/elite also fire weakly (+0.9 to +5.9, 12 of 12), hinting at a
    weak topic component; with only one document, this is untested.
  fires_on: "'class'/'Class'/'classes'/'classroom'/'classic', and 'class' as the first piece of classify, classical, classmate"
  not_on: >-
    In the fineweb-1m deep sample (6,141 tokens, but only 3 documents), course, school, group, type and kind
    never cross the + threshold (course and school mostly go negative). Category and spelling near misses such
    as "glass" don't occur there, so they are untested; a broad non-firing claim needs an activation test.
  evidence: [0, 2, 3, 5, 7, 9, 12, 14, 16, 22, 29, 31]
  verification: untested
negative:
  status: explained
  confidence: weak
  cue_type: semantic-topic
  explanation: >-
    About 15x weaker (min -9.4 vs max +136). Fires on grouping nouns that are near-synonyms of "class" but not
    the word itself: category/categorize, course, school, company, club, cluster. On fineweb-10m-sparse,
    category/categories (237), course(s) (109) and club(s) (54) make up about 73% of the 550 firings below
    -2.6 recorded in the sparse tier. In the fineweb-1m deep sample (3 documents), course crosses the -
    threshold (-1.25) on 9 of 10 tokens (79x the 1.1% base rate), company on 7 of 9 and school on 8 of 12. The logit lens fits: this side pushes
    " class", " classes" and " classical" up as next tokens.
  fires_on: "'category'/'categories'/'categorize', 'course(s)', 'school', 'company', 'club', 'cluster'"
  not_on: >-
    The word "class" itself (all 6 deep "class" tokens are strongly positive). The firing is weak: most values
    sit at -1.5 to -3.5, and 5 random layer-39 neurons reach -6 to -11 on their own negative sides, so the size is
    ordinary for this layer and only the pattern is specific. Several top exemplars are noise (function words in
    boilerplate; rank 0 is a patent number right after <|begin_of_text|>), and school and company come from
    only one or two documents, so confidence is weak.
  evidence: [4, 6, 8, 9, 13, 14, 19, 23, 25, 26, 28, 29]
  verification: untested
relation: variant
relation_note: >-
  Both sides track the idea of a class or grouping: the positive side marks the word "class" itself and
  predicts how it continues, while the negative side weakly marks other grouping words (category, course,
  school) and, per the logit lens, nudges the model toward saying "class".
