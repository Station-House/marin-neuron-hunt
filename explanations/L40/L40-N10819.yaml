neuron: L40-N10819
data: pilot/fineweb-10m-sparse
label: "Interaction context and uses of each"
positive:
  status: explained
  confidence: weak
  cue_type: grammar
  explanation: >-
    Atlas examples often show positive activation on verbs or prepositions
    before reciprocal expressions such as "each other" and "one another".
    In a separate 16-pair contrast, activation at " from" was higher after
    descriptions of interactive actions in 15 pairs (results PR #53). This
    supports sensitivity to the preceding wording, not a uniquely reciprocal cue.
  fires_on: "'transform each other', 'from each other', 'know each other', 'against one another'"
  not_on: >-
    The matched noninteractive contexts generally produced lower activation
    at " from", but none was established as a non-firing context.
  evidence: [5433078, 1630135, 5069115, 8354981, 3530408, 8746334, 5433076]
  verification: confirmed
negative:
  status: explained
  confidence: weak
  cue_type: lexical
  explanation: >-
    Negative activation at " each" was strong in all 12 reciprocal examples
    and all 12 distributive controls. The reciprocal examples had a more
    negative mean activation, but the controls also exceeded the negative-side
    threshold in magnitude, refuting the predicted selectivity (results PR #45).
    This test did not establish a response specific to "each other".
  fires_on: "the token 'each' in both reciprocal and distributive contexts"
  not_on: "No below-threshold control was found among the 24 tested prompts"
  evidence: [7193905, 5640015, 7783001, 6628500, 8307119, 7000615, 9248546]
  verification: refuted
relation: variant
relation_note: >-
  The positive-side contrast showed sensitivity to interactive wording at
  " from". The negative side also responded at " each" without reciprocal
  phrasing, so a shared selective cue has not been established.
