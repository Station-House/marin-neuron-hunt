neuron: L40-N19620
data: pilot/fineweb-10m-sparse
label: "South/east versus north/west geographic language"
positive:
  status: explained
  confidence: weak
  cue_type: lexical
  explanation: >-
    Strong positive activations occur on or immediately after south- and
    east-oriented location phrases, particularly "southeast", "southeastern",
    "eastern", and "south of". In a 24-pair contrast, activation at the
    following " of" token was higher for south/east wording than for the
    matched north/west wording in every pair (results PR #50).
  fires_on: >-
    Geographic expressions such as "southeast Nebraska", "Eastern Iowa",
    "southeastern Connecticut", and "southeast of Bossier City".
  not_on: >-
    North/west alternatives produced lower positive activation in the 24
    matched pairs, but absence of firing was not established. Non-directional
    geographic phrases were not tested.
  evidence: [0, 1, 2, 3, 4, 6, 7, 8, 9, 11, 14, 17, 20, 24, 28, 31]
  verification: confirmed
negative:
  status: explained
  confidence: weak
  cue_type: lexical
  explanation: >-
    Strong negative activations occur on or immediately after north- and
    west-oriented location phrases, especially "northwest", "northwestern",
    and "NW". Some examples are place names or institutional names, so a
    strictly geographic interpretation remains uncertain.
  fires_on: >-
    Expressions such as "northwest corner of Louisiana", "NW Borneo",
    "Northwest Illinois", and "northwestern shore".
  not_on: >-
    Not established for matched south/east or non-directional geographic phrases.
  evidence: [0, 1, 2, 3, 4, 5, 7, 8, 10, 12, 15, 17, 18, 22, 23, 28, 30, 31]
  verification: untested
relation: variant
relation_note: >-
  Positive examples favor south/east references; negative examples favor
  north/west references, sometimes within the same source document.
