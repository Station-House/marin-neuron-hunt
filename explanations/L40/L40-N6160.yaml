  confidence: weak
  cue_type: phrase-idiom
  explanation: >-
    Fires on the first "as" of an "as ... as" phrase that sets an extreme time or amount ("as early as
    1820", "as recently as February", "as far back as", "as long ago as", "as little as five years"),
    and its output pushes " early", " late", " recently" (logit lens top). "As early as" passes the
    threshold 76% of the time (40% strongly), "as recently as" 92% (46%), "as far back as" 10 of 11
    (5 strongly) and "as little / few / low as" 83% (16%), against 2% strongly for the common "as soon
    as", 0 of 255 for "as far as", 1% for "as long as" and 22 strong firings among 37,586 other "as";
    58.7% of the side's 121 strong firings are in these phrases.
  fires_on: "the first 'as' of 'as early / recently / late / far back / long ago / little / few / low as'"
  not_on: >-
