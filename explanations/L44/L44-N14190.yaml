neuron: L44-N14190
data: pilot/fineweb-10m-sparse
label: "nonprofit/charity text: sector identity vs dollar amounts"
positive:
  status: explained
  confidence: weak
  cue_type: semantic-topic
  explanation: >-
    Fires on nonprofit and charity sector content: an organization's legal/charitable status
    ("501(c)", "501(c)3", "registered charity", "nonprofit corporation", Australian "DGR status"),
    charity infrastructure ("Google for Nonprofits", a "4-star rating on Charity Navigator"), and the
    fundraising profession ("Non-profit leadership", "Canada's charitable sector", "digital fundraising
    strategy"). The logit lens is textbook-clean, pushing " nonprofit", " nonprofits", " charitable",
    " charity", " donors" and " donation". Very selective (positive on only 16% of tokens; max +123,
    pos_q99 7.43) with 18,575 positive stored firings. An activation test (-001, #68) REFUTED the broad
    "nonprofit sector identity" reading: only half the nonprofit should-fire prompts cleared the pos_q99
    threshold - status and registration terms ("nonprofit", "nonprofits", "exempt", "registered",
    "foundation") fired strongly, but "mission", "grants", "donors", "volunteers" and "charity" stayed
    weak - and it false-fired on "registered" in "registered trademark" (+10.6) and "company" in
    "incorporated as a company" (+12.6). So it keys on formal legal / organizational-status and
    incorporation wording, which overlaps nonprofit language without being specific to it; the whole-sector
    claim is too strong, hence weak confidence.
  fires_on: "formal nonprofit / organizational-status wording (501(c), registered, nonprofit corporation, exempt, DGR status, Charity Navigator) fires strongly; broader charity vocabulary (mission, grants, donors, volunteers) only weakly"
  not_on: >-
    the broad "whole nonprofit sector" reading is refuted (-001, #68): much general charity vocabulary
    fires only weakly, and "registered" / "company" fire in for-profit and legal contexts too. Non-firing
    is still read only from the sparse tier.
  evidence: [1, 3, 4, 5, 8, 10, 11, 12, 17, 20]
  verification: refuted
negative:
  status: explained
  confidence: weak
  cue_type: mixed
  explanation: >-
    Much rarer and weaker than the + side (678 stored negative firings vs 18,575 positive; min -40.0 vs
    max +123.0). Fires across nonprofit and fundraising text on monetary amounts and financial specifics. "$" is its
    single most common firing token (~5% of its firings) but it fires broadly across such text, not
    overwhelmingly on "$": organizational finances ("revenue totalled $212
    million", "assets total $6.71", budgets of "$500,000") and the prices of fundraising ("donation of
    $18 per family", "raffle tickets for $5", admission "$12", "Freewill donation: $5 per person"), plus
    a few fundraising-event words ("silent auction", "the event raised"). The gate is open and a negative
    `up` carries the sign; the logit lens is incoherent, so this side is an input detector, not an
    output-pusher. An activation test (-002, #69) CONFIRMED that it fires on "$" specifically in nonprofit /
    fundraising context and not on "$" generally: donation and charity-finance "$" prompts fired strongly
    (should-fire 83% past threshold, mean act -10.6) while for-profit / consumer "$" (smartphone price,
    rent, salary, venture round) stayed near zero (should-not-fire 100% below threshold, AUROC 0.83).
  fires_on: "dollar amounts and financial figures in nonprofit / fundraising text - revenue, assets, budgets, ticket / admission / donation prices; '$' is the most common single firing token (~5%) but it fires broadly across such text"
  not_on: >-
    confirmed nonprofit-specific (-002, #69): it does NOT fire on "$" in for-profit / consumer contexts
    (phone price, rent, salary, venture round). Non-firing outside "$" is still read only from the sparse tier.
  evidence: [0, 1, 2, 7, 9, 13, 15, 21, 28, 31]
  verification: confirmed
relation: variant
relation_note: >-
  Both sides fire inside nonprofit and charity text: the + side keys on formal nonprofit /
  organizational-status wording (narrower and noisier than first claimed - refuted, -001), and the
  - side on the monetary amounts and financial specifics within such text (confirmed nonprofit-specific,
  -002).
