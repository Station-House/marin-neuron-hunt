type: contrast
neuron: L45-N1382
side: "+"
# Marin is causal: the activation at " the" cannot see the "other day" or "other hand" after it. So the two prompts
# in a pair differ only in the words BEFORE " the", and the target is always " the". The text after the target only
# keeps each sentence natural.
# High: " the" right after a finished past-tense clause ("My brother called me just the", "I bumped into an old
# classmate at the bank the"), where the recent-past adverbial "the other day / night" is the likely continuation.
# Low: " the" in a context where " other" is just as likely next, but not as a time adverbial. Pairs 1-9 use
# the explanation's own not_on cases, "on the other hand" and "the other side / end / half / hand" (0 of 358 and
# 0 of 150 past q999). Pairs 10-20 use "one ..., the other ..." (a contrast between two items), the "the other +
# noun" case.
# So every low keeps " other" the likely next token. If the side only predicts " other" after " the", the lows
# fire as much as the highs and the test fails.
pairs:
  - {high: "My brother called me just[[ the]] other day to ask about the car.", low: "The apartment is cheap, but on[[ the]] other hand it is far from work."}
  - {high: "I bumped into an old classmate at the bank[[ the]] other day.", low: "The bridge connects one side of the river to[[ the]] other side."}
  - {high: "We were talking about this very thing[[ the]] other night over dinner.", low: "He typed with one hand and held a sandwich in[[ the]] other."}
  - {high: "The neighbor's dog got out of the yard[[ the]] other day and ran down the street.", low: "The store has an entrance at one end and an exit at[[ the]] other end."}
  - {high: "She told me about her new job[[ the]] other evening.", low: "She is good at math, but on[[ the]] other hand she struggles with writing."}
  - {high: "Our team had fifteen assists[[ the]] other night against Denver.", low: "He is standing on one side of the road, and his dog is on[[ the]] other side."}
  - {high: "I read an interesting article about sleep[[ the]] other day.", low: "I can go on Friday, or on[[ the]] other hand we could wait until Monday."}
  - {high: "He mentioned that he was moving to Spain[[ the]] other day.", low: "Half of the road was closed, so the traffic used[[ the]] other half."}
