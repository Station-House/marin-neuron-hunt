# Ablation (type C) for L63-N11058, pre-registered together with L63-N11058-001.
# Rationale: the + side fires at huge magnitude (atlas exemplars 7200-10368) on boilerplate
# digit/punctuation tokens, and the logit lens shows it pushing URL-path fragments
# ('/port' 0.875, '/front', '/dr', '/company', ...). Concrete prediction: zero-ablating the
# neuron at its fire sites lowers the next-token logprob of the URL-path fragment '/company'
# (the token with the strongest lens push among plausible continuations).
type: ablation
neurons: [L63-N11058]
mode: zero
prompts:
  - "Patent US8201977[[,]] granted in 2007, covers a packet-routing method with 24 enumerated claims and two figures."
  - "The appeal docket numbered [[374]] of the third circuit was decided together with two related cases in the same term."
  - "Paragraph [[004]] of the patent application describes the prior art in microwave antenna arrays, citing three earlier filings."
  - "See the register of actions[[:]] all filings in case 1618364 are listed under the third-circuit docket."
  - "The terms of service were revised on [[536]] separate occasions according to the archived snapshots of the hosting page."
  - "The statute was amended in section [[230]] of title 35, adding a paragraph on provisional rights for patent holders."
  - "The patent bibliography lists US7390894[[,]] US8201977, and four foreign equivalents in alphabetical order."
  - "Entry [[972]] of the index references the privacy-policy revision history preserved by the hosting archive."
  - "The legal brief ran to [[340]] pages, most of them appendices and tables of authorities."
  - "The connector housing[[,]] as shown in Fig. 5 of the cited patent, carries the signal pins on its upper face."
  - "Claims [[603]] through 609 were rejected in the office action for obviousness over the cited prior art."
  - "The docket sheet lists motion [[996]] filed by the defendant, seeking judgment on the pleadings under rule 12."
metric: {kind: next-token-logprob, token: "/company"}
predicted_effect: -0.5
by: {github: alexcasper, method: agent, model: "glm-5.3-flash (zai)"}
