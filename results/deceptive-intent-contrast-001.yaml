  choices: "- random neurons: np.random.default_rng(layer).choice(neurons of that layer, 100), L20 excluding 1234;\n- coalitions:\
    \ searched within one layer (the baseline is per layer), greedy, each step adding the unit that maximises\n  (min over\
    \ contrasts of pair-direction rate, then min over contrasts of mean diff / random p95);\n- filler rule: reject if the\
    \ mean filler activation is closer to the mean high-arm activation than to the mean\n  low-arm activation (all three contrasts\
    \ pooled);\n- extra diagnostics, not part of the pass rule: a size-matched baseline (sums of k random neurons) for the\
    \ best\n  coalition, and a sign-flip null that reruns the whole single-neuron + coalition search with each pair's\n  high/low\
    \ labels flipped at random (N_PERM times)."
